[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fno-dashboard-backend"
version = "0.1.0"
description = "NSE F&O options-chain analytics, decision engine, and paper/live trading backend."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }

dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "requests>=2.31",
    "urllib3>=2.0",
    "aiohttp>=3.14.3",
    "websocket-client>=1.7",
    "websockets>=12.0",
    "python-dotenv>=1.0",
    "pyotp>=2.9",
    "pytz>=2023.3",
    "orjson>=3.9",
    "logzero>=1.7",
    "xlwings>=0.30",
    "smartapi-python>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pip-audit>=2.9,<3",
]

# Flat-layout, multiple top-level packages (decision/, oi/, risk/, brokers/,
# storage/, strategy/, ml/, analytics/) plus several top-level modules
# (engine.py, paths.py, pipeline_config.py, etc.) — not a single `src/`
# package. This mirrors the project's actual current layout rather than
# forcing a restructure just to satisfy packaging conventions.
[tool.setuptools.packages.find]
where = ["."]
include = [
    "analytics*", "application*", "backtest*", "brokers*", "core*",
    "decision*", "execution*", "infrastructure*", "market*", "ml*", "oi*",
    "risk*", "server*", "storage*", "strategy*",
]

[tool.setuptools]
py-modules = [
    "paths",
    "nse_eod_fetch",
    "diag_lotsize", "smartapi_feed_adapter", "smartapi_pipeline_adapter",
    "operational_metrics", "operational_readiness",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
